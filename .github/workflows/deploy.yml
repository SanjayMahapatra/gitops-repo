name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ================= DEV STAGE =================
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=my-project
            -Dsonar.organization=my-org
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}

      # Build Docker Image
      - name: Build Docker Image
        run: docker build -t sanjaym1978/mychennel:${{ github.sha }} .

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.1_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.1_Linux-64bit.deb

      # Trivy Scan
      - name: Scan Docker Image
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 sanjaym1978/mychennel:${{ github.sha }}

      # Docker Login
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Push Image
      - name: Push Docker Image
        run: docker push sanjaym1978/mychennel:${{ github.sha }}

      # Slack Notification (Dev)
      - name: Notify Slack (DEV)
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"DEV Deployment Completed"}' \
          ${{ secrets.SLACK_WEBHOOK }}

  # ================= QA STAGE =================
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Deploy to QA
        run: echo "Deploying to QA"

      - name: Notify Slack (QA)
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"QA Deployment Completed"}' \
          ${{ secrets.SLACK_WEBHOOK }}

  # ================= PROD STAGE =================
  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy to PROD
        run: echo "Deploying to PROD"

      - name: Notify Slack (PROD)
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"PROD Deployment Completed"}' \
          ${{ secrets.SLACK_WEBHOOK }}