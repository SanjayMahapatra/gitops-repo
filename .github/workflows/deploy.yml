name: Deploy Pipeline

on:
  push:
    branches:
      - main


jobs:
  # ================= DEV STAGE =================
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # # SonarQube Scan (SonarCloud)
      # - name: SonarQube Scan
      #   uses: SonarSource/sonarcloud-github-action@v3
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   with:
      #     args: >
      #       -Dsonar.projectKey=my-project
      #       -Dsonar.organization=my-org
      #       -Dsonar.host.url=https://sonarcloud.io

      # Build Docker Image
      - name: Build Docker Image
        # run: docker build -t sanjaym1978/mychennel:${{ github.sha }} .
        run: docker build -f .github/Dockerfile -t sanjaym1978/mychennel:${{ github.sha }} .


      # Install Trivy
      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.68.2
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb
          sudo dpkg -i trivy_${TRIVY_VERSION}_Linux-64bit.deb

     # Trivy Scan
      - name: Scan Docker Image
        run: |
          docker images | head -n 50
          docker image inspect sanjaym1978/mychennel:${{ github.sha }}
          trivy image --severity HIGH,CRITICAL --exit-code 1 sanjaym1978/mychennel:${{ github.sha }}

      # Docker Login
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Push Image
      - name: Push Docker Image
        run: docker push sanjaym1978/mychennel:${{ github.sha }}

  # ================= QA STAGE =================
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Deploy to QA
        run: echo "Deploying to QA"

  # ================= PROD STAGE =================
  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy to PROD
        run: echo "Deploying to PROD"
