name: Slack Notify
description: Send a Slack webhook notification with deployment status

inputs:
  webhook:
    description: Slack webhook URL
    required: true
  environment:
    description: Deployment environment (e.g. DEV, QA, PROD)
    required: true
  status:
    description: Job status (e.g. success, failure, cancelled)
    required: true

runs:
  using: composite
  steps:
    - name: Send Slack notification
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ inputs.webhook }}
      run: |
        set -euo pipefail
        msg="${{ inputs.environment }} deploy finished: ${{ inputs.status }}
        Repo: ${{ github.repository }}
        Ref: ${{ github.ref_name }}
        Commit: ${{ github.sha }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        payload=$(jq -n --arg text "$msg" '{text: $text}')
        curl -fsS -X POST -H 'Content-type: application/json' \
          --data "$payload" \
          "$SLACK_WEBHOOK"
